<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Your OTP — Newfly Tech Solutions</title>
<style>
  body{margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#222}
  .wrap{max-width:560px;margin:36px auto;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(10,20,40,0.06);overflow:hidden}
  .hdr{background:linear-gradient(135deg,#0b5ed7,#084298);padding:20px;color:#fff;text-align:center}
  .hdr h1{margin:0;font-size:18px}
  .body{padding:22px;text-align:center}
  .otp{display:inline-block;background:#eef3ff;padding:14px 28px;border-radius:8px;font-size:28px;color:#0b5ed7;font-weight:700;letter-spacing:6px;border:1px solid #dbe9ff}
  .note{margin-top:12px;color:#666;font-size:13px}
  .ftr{background:#fbfdff;padding:12px 18px;text-align:center;color:#666;font-size:13px}
  @media (max-width:420px){.otp{font-size:22px;padding:12px 20px;letter-spacing:4px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <h1>OTP Verification</h1>
    </div>

    <div class="body">
      <p style="margin:0 0 12px">Hello <strong>{{ name or 'User' }}</strong>,</p>
      <p style="margin:0 0 18px">Use the following OTP to complete your verification. It is valid for <strong>5 minutes</strong>.</p>

      <div class="otp">{{ otp }}</div>

      <p class="note">Never share this code with anyone. If you did not request this, please ignore this email.</p>
    </div>

    <div class="ftr">
      Newfly Tech Solutions · <a href="https://www.newflytechsolutions.com" style="color:#0b5ed7;text-decoration:none">www.newflytechsolutions.com</a>
    </div>
  </div>
</body>
</html>
